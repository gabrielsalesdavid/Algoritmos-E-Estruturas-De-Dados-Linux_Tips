<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">Caminho dos dados ao ler e salvar JSON</title>
  <desc id="desc">O arquivo JSON é lido, convertido em dados Python, atualizado e depois gravado no arquivo.</desc>
  <rect width="980" height="320" rx="20" fill="#f4f7fb"/>
  <text x="490" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#183153">Do arquivo JSON aos dados Python e de volta</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="42" y="115" width="190" height="105" rx="14" fill="#dceeff" stroke="#2676a8" stroke-width="3"/>
    <text x="137" y="155" font-size="20" font-weight="700" fill="#183153">Arquivo .json</text>
    <text x="137" y="187" font-size="16" fill="#52657a">texto guardado</text>
    <rect x="285" y="115" width="190" height="105" rx="14" fill="#d9f2e6" stroke="#21845a" stroke-width="3"/>
    <text x="380" y="155" font-size="20" font-weight="700" fill="#183153">json.load()</text>
    <text x="380" y="187" font-size="16" fill="#52657a">lê e converte</text>
    <rect x="528" y="115" width="190" height="105" rx="14" fill="#e9ddff" stroke="#7043a5" stroke-width="3"/>
    <text x="623" y="155" font-size="20" font-weight="700" fill="#183153">Lista / dicionários</text>
    <text x="623" y="187" font-size="16" fill="#52657a">dados em Python</text>
    <rect x="770" y="115" width="170" height="105" rx="14" fill="#fff0cf" stroke="#a66a00" stroke-width="3"/>
    <text x="855" y="155" font-size="20" font-weight="700" fill="#183153">json.dump()</text>
    <text x="855" y="187" font-size="16" fill="#52657a">grava alterações</text>
  </g>
  <path d="M232 168h45m-12-8 12 8-12 8M475 168h45m-12-8 12 8-12 8M718 168h45m-12-8 12 8-12 8" fill="none" stroke="#183153" stroke-width="3"/>
  <path d="M855 230v48H137v-48" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="m129 241 8-12 8 12" fill="none" stroke="#b42318" stroke-width="2"/>
  <text x="490" y="269" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9f1d16">Atenção: gravar em modo "w" substitui o conteúdo anterior do arquivo.</text>
</svg>
