<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Colisão entre chaves em uma tabela hash</title>
  <desc id="desc">Duas chaves diferentes geram a mesma posição e ficam armazenadas como entradas distintas após o tratamento da colisão.</desc>
  <rect width="960" height="390" rx="20" fill="#f4f7fb"/>
  <text x="480" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#183153">Colisão: mesma posição, chaves diferentes</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="55" y="112" width="210" height="72" rx="12" fill="#dceeff" stroke="#2676a8" stroke-width="3"/>
    <text x="160" y="156" text-anchor="middle" font-size="20" fill="#183153">Cliente Ana</text>
    <rect x="55" y="218" width="210" height="72" rx="12" fill="#e9ddff" stroke="#7043a5" stroke-width="3"/>
    <text x="160" y="262" text-anchor="middle" font-size="20" fill="#183153">Cliente Bruno</text>
    <path d="M267 148H355M267 254H355M355 148V254" fill="none" stroke="#52657a" stroke-width="3"/>
    <path d="M355 201H425" stroke="#52657a" stroke-width="4"/>
    <path d="m415 191 14 10-14 10" fill="none" stroke="#52657a" stroke-width="4"/>
    <rect x="435" y="157" width="190" height="88" rx="14" fill="#fff3cd" stroke="#ad7a00" stroke-width="3"/>
    <text x="530" y="193" text-anchor="middle" font-size="17" font-weight="700" fill="#183153">MESMO HASH</text>
    <text x="530" y="223" text-anchor="middle" font-size="20" fill="#183153">posição 100</text>
    <path d="M628 201H695" stroke="#52657a" stroke-width="4"/>
    <path d="m685 191 14 10-14 10" fill="none" stroke="#52657a" stroke-width="4"/>
    <rect x="705" y="112" width="205" height="178" rx="14" fill="#d9f2e6" stroke="#21845a" stroke-width="3"/>
    <text x="807" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#183153">ENTRADAS DISTINTAS</text>
    <text x="730" y="193" font-size="17" fill="#183153">hash 100 + Ana</text>
    <text x="730" y="229" font-size="17" fill="#183153">hash 100 + Bruno</text>
    <text x="730" y="268" font-size="14" fill="#52657a">igualdade distingue as chaves</text>
  </g>
  <text x="480" y="333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#52657a">Uma colisão não substitui automaticamente um registro por outro: a tabela precisa resolvê-la.</text>
  <text x="480" y="359" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52657a">Exemplo conceitual de tratamento; detalhes de implementação variam entre tabelas hash.</text>
</svg>
